name: CI/CD ProductTrendTracker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pyarrow

      # Step 4: Run tests with coverage
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=term-missing
          pytest --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
        name: coverage-report
        path: htmlcov/

      # Step 6: Build Docker image (optional)
      - name: Build Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}

      # Step 7: Login to GHCR
      - name: Login to GHCR
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 8: Push Docker image
      - name: Push Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker tag product-trend-tracker:${{ github.sha }} ghcr.io/${{ github.repository }}/product-trend-tracker:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/product-trend-tracker:${{ github.sha }}
