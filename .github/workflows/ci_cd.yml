name: CI/CD ProductTrendTracker

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install dependencies
      - name: Install dependencies
        working-directory: product-trend-tracker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pyarrow

      # Step 4: Run tests with coverage
      - name: Run tests
        working-directory: product-trend-tracker
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest --cov=. --cov-report=term-missing
          pytest --cov=. --cov-report=xml
          pytest --cov=. --cov-report=html

      # Step 5: Upload Coverage Report
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: product-trend-tracker/htmlcov/

      # Step 6: Build Docker image (if Dockerfile exists)
      - name: Build Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build -t product-trend-tracker:${{ github.sha }} .

      # Step 7: Login to GHCR
      - name: Login to GHCR
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 8: Push Docker image
      - name: Push Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          ORG_LC="harshika2025"
          IMAGE="product-trend-tracker"
          TAG="${{ github.sha }}"

          echo "Pushing to: ghcr.io/$ORG_LC/$IMAGE:$TAG"

          docker tag product-trend-tracker:${TAG} ghcr.io/$ORG_LC/$IMAGE:$TAG
          docker push ghcr.io/$ORG_LC/$IMAGE:$TAG

