name: CI/CD ProductTrendTracker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # Step 4: Run tests with coverage
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=term-missing
          pytest --cov=. --cov-report=xml

      # Step 5: Upload coverage report as artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

# Step 6: (Optional) Build Docker image if Dockerfile exists
- name: Build Docker image
  if: ${{ hashFiles('Dockerfile') != '' }}
  run: docker build -t product-trend-tracker:${{ github.sha }} .

# Step 7: (Optional) Push Docker image to GitHub Packages
- name: Push Docker image
  if: ${{ hashFiles('Dockerfile') != '' }}
  uses: docker/login-action@v3
  with:
    registry: ghcr.io
    username: ${{ github.actor }}
    password: ${{ secrets.GITHUB_TOKEN }}

- name: Push image
  if: ${{ hashFiles('Dockerfile') != '' }}
  run: |
    docker tag product-trend-tracker:${{ github.sha }} ghcr.io/${{ github.repository }}/product-trend-tracker:${{ github.sha }}
    docker push ghcr.io/${{ github.repository }}/product-trend-tracker:${{ github.sha }}
