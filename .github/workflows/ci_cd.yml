name: CI/CD ProductTrendTracker

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: product-trend-tracker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pyarrow

      - name: Run tests
        working-directory: product-trend-tracker
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest --cov=. --cov-report=term-missing
          pytest --cov=. --cov-report=xml
          pytest --cov=. --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: product-trend-tracker/htmlcov/

      - name: Build Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build -t product-trend-tracker:${{ github.sha }} .

      - name: Login to GHCR
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          ORG="harshika2025"
          IMG="product-trend-tracker"
          TAG="${{ github.sha }}"

          docker tag product-trend-tracker:$TAG ghcr.io/$ORG/$IMG:$TAG
          docker push ghcr.io/$ORG/$IMG:$TAG
