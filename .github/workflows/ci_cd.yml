name: CI/CD ProductTrendTracker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pyarrow httpx

      # FIXED — add PYTHONPATH
      - name: Run tests
        working-directory: ./product-trend-tracker
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          echo "PYTHONPATH = $PYTHONPATH"
          pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=term-missing
          pytest --cov=. --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: product-trend-tracker/htmlcov/

      - name: Build Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build -t product-trend-tracker:${{ github.sha }} .

      - name: Login to GHCR
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          docker tag product-trend-tracker:${{ github.sha }} ghcr.io/${{ github.repository }}/product-trend-tracker:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/product-trend-tracker:${{ github.sha }}
