      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: product-trend-tracker/htmlcov/

      - name: Build Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: docker build -t product-trend-tracker:${{ github.sha }} .

      - name: Login to GHCR
        if: ${{ hashFiles('Dockerfile') != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ hashFiles('Dockerfile') != '' }}
        run: |
          USER_LC="${GITHUB_ACTOR,,}"
          echo "Using GHCR user namespace: $USER_LC"

          docker tag product-trend-tracker:${{ github.sha }} ghcr.io/$USER_LC/product-trend-tracker:${{ github.sha }}
          docker push ghcr.io/$USER_LC/product-trend-_

