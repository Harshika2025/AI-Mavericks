name: Build, Test, Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: pytest -q

    # ------------------------------------------------------
    # GHCR Login
    # ------------------------------------------------------
    - name: Log in to GHCR
      run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    # ------------------------------------------------------
    # Build & Push API image
    # ------------------------------------------------------
    - name: Build and push API image
      run: |
        OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
        IMAGE="ghcr.io/${OWNER_LC}/product-trend-tracker-api:latest"
        echo "Pushing $IMAGE"
        docker build -t "$IMAGE" -f Dockerfile.api .
        docker push "$IMAGE"

    # ------------------------------------------------------
    # Build & Push Trainer image
    # ------------------------------------------------------
    - name: Build and push Trainer image
      run: |
        OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
        IMAGE="ghcr.io/${OWNER_LC}/product-trend-tracker-trainer:latest"
        echo "Pushing $IMAGE"
        docker build -t "$IMAGE" -f Dockerfile.trainer .
        docker push "$IMAGE"
