name: Build, Test & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # ------------------------------------------------------
    # Checkout the repo
    # ------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------------------------------
    # Install Python for tests
    # ------------------------------------------------------
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ------------------------------------------------------
    # Run tests
    # ------------------------------------------------------
    - name: Run tests
      run: |
        pytest -q

    # ------------------------------------------------------
    # Log in to GHCR using REPO OWNER (harshika2025)
    # ------------------------------------------------------
    - name: Log in to GHCR
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | \
        docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

    # ------------------------------------------------------
    # Build & Push API image
    # ------------------------------------------------------
    - name: Build and push API image
      run: |
        OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
        IMAGE="ghcr.io/${OWNER_LC}/product-trend-tracker-api:latest"
        echo "Pushing $IMAGE"
        docker build -t "$IMAGE" -f Dockerfile.api .
        docker push "$IMAGE"

    # ------------------------------------------------------
    # Build & Push Trainer image
    # ------------------------------------------------------
    - name: Build and push Trainer image
      run: |
        OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
        IMAGE="ghcr.io/${OWNER_LC}/product-trend-tracker-trainer:latest"
        echo "Pushing $IMAGE"
        docker build -t "$IMAGE" -f Dockerfile.trainer .
        docker push "$IMAGE"
