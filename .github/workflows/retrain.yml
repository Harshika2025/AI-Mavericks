name: Auto Retrain & Publish

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # allow manual run from the UI

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyarrow joblib pandas

    - name: Run retraining script
      run: |
        python product_trend_tracker/retrain_and_publish.py

    - name: Upload model registry as artifact
      uses: actions/upload-artifact@v3
      with:
        name: model_registry
        path: model_registry
