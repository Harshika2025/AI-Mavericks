name: Automated Retraining

on:
  schedule:
    - cron: "0 */12 * * *"   # Runs every 12 hours (2+ versions per week guaranteed)
  workflow_dispatch:          # Also allows manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyarrow joblib pandas

    - name: Run retraining
      run: |
        python retrain_and_publish.py

    - name: Upload model registry as artifact (optional)
      uses: actions/upload-artifact@v3
      with:
        name: model_registry
        path: model_registry
