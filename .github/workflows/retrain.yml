name: Automated Model Retraining

on:
  schedule:
    - cron: "0 */12 * * *"      # 🔁 Runs every 12 hours
  workflow_dispatch:            # ▶ Allows manual trigger from GitHub UI

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyarrow joblib pandas

    - name: Run retraining script
      run: |
        python product_trend_tracker/retrain_and_publish.py

    # Optional: Save new version into the repo (hot-swap for live API)
    - name: Commit updated model registry
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"

        git add model_registry latest.txt || true
        git commit -m "Automated retraining update" || echo "No changes to commit"
        git push

    # Save artifacts too (backup)
    - name: Upload model registry as artifact
      uses: actions/upload-artifact@v4
      with:
        name: model_registry
        path: model_registry
