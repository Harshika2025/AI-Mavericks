name: CI/CD Product Trend Tracker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r product-trend-tracker/requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        cd product-trend-tracker
        pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=term-missing
        pytest --cov=. --cov-report=xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: product-trend-tracker/.pytest_cache/

    - name: Build Docker image
      run: |
        docker build -t product-trend-tracker .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      run: |
        docker tag product-trend-tracker ${{ secrets.DOCKER_USERNAME }}/product-trend-tracker:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/product-trend-tracker:latest
